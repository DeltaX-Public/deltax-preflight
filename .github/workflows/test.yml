name: Test
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm test
      - name: Test npm package from its archive
        run: |
          archive="$(npm pack --pack-destination "$RUNNER_TEMP" --ignore-scripts --silent)"
          install_root="$RUNNER_TEMP/preflight-npm-smoke"
          npm install --prefix "$install_root" "$RUNNER_TEMP/$archive" --offline --ignore-scripts --no-audit --no-fund
          commands="$install_root/node_modules/.bin"
          examples="$install_root/node_modules/deltax-preflight/examples"
          "$commands/deltax-preflight-try" --example
          "$commands/deltax-preflight-init" "$RUNNER_TEMP/preflight-starter"
          if "$commands/deltax-preflight" "$RUNNER_TEMP/preflight-starter/decision.json" --policy "$RUNNER_TEMP/preflight-starter/policy.json" --evidence "$RUNNER_TEMP/preflight-starter/evidence.json"; then
            echo 'Unproven starter files unexpectedly passed' >&2
            exit 1
          else
            test "$?" -eq 4
          fi
          "$commands/deltax-preflight" "$examples/single.json" --policy "$examples/single-policy.json" --evidence "$examples/single-evidence.json"
          test ! -e "$install_root/node_modules/deltax-preflight/mcp"
      - run: node docs/demo/generate-fixtures.mjs --check
      - uses: ./
        with:
          decision_file: examples/single.json
          policy_file: examples/single-policy.json
          evidence_file: examples/single-evidence.json
          expected_policy_sha256: c1672d4ac9c0b19c93d6a930e54312602c456a390c74e814a6d316a7315ef07f
