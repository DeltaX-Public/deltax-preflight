name: Publish demo

on:
  push:
    branches: [main]
    paths:
      - docs/demo/**
      - .github/workflows/publish-demo.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages-demo
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Verify demo results against the validator
        run: node docs/demo/generate-fixtures.mjs --check
      - name: Stage static demo files
        run: |
          mkdir -p "$RUNNER_TEMP/preflight-demo"
          cp docs/demo/index.html docs/demo/app.js docs/demo/styles.css \
            docs/demo/fixtures.js docs/demo/poster.svg "$RUNNER_TEMP/preflight-demo/"
          touch "$RUNNER_TEMP/preflight-demo/.nojekyll"
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/preflight-demo

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
